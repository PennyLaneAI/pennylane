name: Test Documentation Code Examples
permissions:
  contents: read

on:
  merge_group:
    types:
      - checks_requested
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  determine_runner:
    if: github.event.pull_request.draft == false
    name: Determine runner type to use
    uses: ./.github/workflows/determine-workflow-runner.yml
    with:
      default_runner: ubuntu-latest
      force_large_runner: ${{ github.event_name == 'merge_group' }}

  documentation-tests:
    if: github.event.pull_request.draft == false
    needs: [determine_runner]
    runs-on: ${{ needs.determine_runner.outputs.runner_group }}

    name: Test Documentation Code Examples

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pip and setuptools
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade setuptools uv==0.9.12

      - name: Prepare companion dependencies
        uses: ./.github/actions/prepare-companion-dependencies
        with:
          catalyst: 'true'
          github-token: ${{ github.token }}

      - name: Install Catalyst and Lightning companions
        run: uv pip install pennylane-catalyst pennylane-lightning

      - name: Install PyTorch (CPU-only)
        run: |
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install PennyLane (editable)
        run: |
          uv pip install --group doctest -e .

      - name: Print Dependencies
        run: |
          python -c "import pennylane2 as qp; qp.about()"
          python -m pip list

      # TODO: Remove the --ignore options as layers are tested and verified
      # to be working correctly.
      - name: Test 'pennylane2' folder
        run: |
          WONT_FIX="
          --ignore=pennylane2/labs
          --ignore=pennylane2/logging
          --ignore=pennylane2/devices/_legacy_device.py
          --ignore=pennylane2/devices/_qubit_device.py
          "

          TO_DO="
          --ignore=pennylane2/pauli/pauli_sparse_matrices.md
          --ignore=pennylane2/control_flow
          --ignore=pennylane2/math
          --ignore=pennylane2/compiler
          --ignore=pennylane2/capture
          --ignore=pennylane2/gradients
          --ignore=pennylane2/optimize
          --ignore=pennylane2/io
          --ignore=pennylane2/data
          --ignore=pennylane2/debugging
          --ignore=pennylane2/qchem
          "

          IGNORE="
          ${WONT_FIX}
          ${TO_DO}
          "

          pytest pennylane2 $IGNORE --ignore-glob='*tests*'

      - name: Test 'doc' folder
        if: always()
        run: |
          WONT_FIX="
          --ignore=doc/code
          --ignore=doc/releases
          --ignore=doc/_static
          --ignore=doc/_templates
          "
          TO_DO="
          --ignore=doc/development
          --ignore=doc/news
          --ignore=doc/introduction/chemistry.rst
          --ignore=doc/introduction/compiling_circuits.rst
          --ignore=doc/introduction/compiling_workflows.rst
          --ignore=doc/introduction/circuits.rst
          --ignore=doc/introduction/data.rst
          --ignore=doc/introduction/dynamic_quantum_circuits.rst
          --ignore=doc/introduction/importing_workflows.rst
          --ignore=doc/introduction/inspecting_circuits.rst
          --ignore=doc/introduction/interfaces.rst
          --ignore=doc/introduction/interfaces
          --ignore=doc/introduction/logging.rst
          --ignore=doc/introduction/measurements.rst
          --ignore=doc/introduction/templates.rst
          --ignore=doc/introduction/unsupported_gradients.rst
          "

          IGNORE="
          ${WONT_FIX}
          ${TO_DO}
          "

          pytest doc ${IGNORE}

        # NOTE: Only run if the file exists (invert result to ensure exit code 0).
        # This avoids CI breakage when RC wranches don't have the 'changelog-dev.rst' file.
        # NOTE: Suppress pytest exit code 5 (No Tests Collected).
        # This avoids CI breakage when the changelog is reset after a RC
        # branch is cut and hasn't yet accumulated any code snippets to test.
      - name: Test `changelog-dev.rst` file
        if: always()
        run: |
          # -p no:doctest makes it so only sybil runs the tests, not pytest's default
          ! [ -f "doc/releases/changelog-dev.rst" ] || pytest -p no:doctest doc/releases/changelog-dev.rst || [ $? -eq 5 ]
