name: "Read the Docs check"
permissions:
  contents: read
on:
  merge_group:
    types:
      - checks_requested
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  push:
    branches:
      - main

jobs:
  rtd_check:
    # Temporary: use Blacksmith while downloading the Catalyst PR wheel.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      PYTHON_VERSION: "3.12"
      TORCH_VERSION: "2.9.0"  # must match pyproject.toml [dependency-groups] docs
      # Space separated list of packages to install for each package manager
      PIP_PACKAGES_TO_INSTALL: "sphinx"
      APT_PACKAGES_TO_INSTALL: "graphviz"
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v6
      with:
        fetch-depth: 1

    - name: Install APT packages
      run: |
        sudo apt-get update
        sudo apt install -y ${{ env.APT_PACKAGES_TO_INSTALL }}

    - name: Setup Python Environment
      id: setup_python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Prepare companion dependencies
      uses: ./.github/actions/prepare-companion-dependencies
      with:
        catalyst: 'true'
        github-token: ${{ github.token }}

    - name: Install dependencies
      run: |
        pip install --upgrade --no-cache-dir pip setuptools uv==0.9.12
        uv pip install --upgrade --no-cache ${{ env.PIP_PACKAGES_TO_INSTALL }}
        uv pip install . pennylane-catalyst
        uv pip install torch~=${{ env.TORCH_VERSION }} --index-url https://download.pytorch.org/whl/cpu
        uv pip install --group docs

    - name: Build Sphinx HTML
      run: |
        cd doc
        python -m sphinx -T -b html -d ./_build/doctrees -D language=en . ./html --keep-going 
